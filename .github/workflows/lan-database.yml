name: LAN database validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/lan-database-reliability]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run lint
      - run: npm run build
